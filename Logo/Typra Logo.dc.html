<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: oklch(97% 0.003 30); }
  </style>
</helmet>

<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 64px; padding: 80px 24px; font-family: 'Space Grotesk', sans-serif;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="width: 52px; height: 52px; border-radius: 10px; background: oklch(0% 0 0); display: flex; align-items: center; justify-content: center; gap: 4px;">
        <div style="width: 5px; height: 14px; border-radius: 1px; background: oklch(65% 0.15 55);"></div>
        <div style="width: 5px; height: 24px; border-radius: 1px; background: oklch(75% 0.16 55);"></div>
        <div style="width: 5px; height: 18px; border-radius: 1px; background: oklch(65% 0.15 55);"></div>
      </div>
      <span style="font-size: 40px; font-weight: 700; color: oklch(22% 0.01 30); letter-spacing: -0.01em;">Typra</span>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(45% 0.01 30); letter-spacing: 0.02em;">luyện gõ code, đa ngôn ngữ</span>
  </div>

  <div style="width: 100%; max-width: 960px; border-radius: 12px; background: oklch(100% 0 0); border: 1px solid oklch(90% 0.005 30); overflow: hidden; box-shadow: 0 16px 40px -24px oklch(20% 0.01 30 / 0.25);">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid oklch(92% 0.005 30);">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 30px; height: 30px; border-radius: 7px; background: oklch(0% 0 0); display: flex; align-items: center; justify-content: center; gap: 3px;">
          <div style="width: 3px; height: 8px; border-radius: 1px; background: oklch(65% 0.15 55);"></div>
          <div style="width: 3px; height: 14px; border-radius: 1px; background: oklch(75% 0.16 55);"></div>
          <div style="width: 3px; height: 10px; border-radius: 1px; background: oklch(65% 0.15 55);"></div>
        </div>
        <span style="font-size: 19px; font-weight: 700; color: oklch(22% 0.01 30);">Typra</span>
      </div>
      <div style="display: flex; gap: 24px; font-size: 14px; color: oklch(45% 0.01 30);">
        <span>Bài luyện</span><span>Thứ hạng</span><span>Hồ sơ</span>
      </div>
    </div>
    <div style="padding: 40px 28px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(55% 0.01 30);">
      header preview — logo trên nền sáng
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 28px;">
    <div style="width: 32px; height: 32px; border-radius: 7px; background: oklch(0% 0 0); display: flex; align-items: center; justify-content: center; gap: 3px;">
      <div style="width: 3px; height: 9px; border-radius: 1px; background: oklch(65% 0.15 55);"></div>
      <div style="width: 3px; height: 15px; border-radius: 1px; background: oklch(75% 0.16 55);"></div>
      <div style="width: 3px; height: 11px; border-radius: 1px; background: oklch(65% 0.15 55);"></div>
    </div>
    <div style="width: 20px; height: 20px; border-radius: 5px; background: oklch(0% 0 0); display: flex; align-items: center; justify-content: center; gap: 2px;">
      <div style="width: 2px; height: 6px; background: oklch(65% 0.15 55);"></div>
      <div style="width: 2px; height: 10px; background: oklch(75% 0.16 55);"></div>
      <div style="width: 2px; height: 7px; background: oklch(65% 0.15 55);"></div>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(45% 0.01 30);">favicon scale</span>
  </div>

  <div style="width: 100%; max-width: 960px; border-radius: 12px; background: oklch(12% 0.005 30); overflow: hidden; box-shadow: 0 16px 40px -24px oklch(0% 0 0 / 0.5);">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid oklch(22% 0.005 30);">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 30px; height: 30px; border-radius: 7px; background: oklch(0% 0 0); display: flex; align-items: center; justify-content: center; gap: 3px;">
          <div style="width: 3px; height: 8px; border-radius: 1px; background: oklch(65% 0.15 55);"></div>
          <div style="width: 3px; height: 14px; border-radius: 1px; background: oklch(75% 0.16 55);"></div>
          <div style="width: 3px; height: 10px; border-radius: 1px; background: oklch(65% 0.15 55);"></div>
        </div>
        <span style="font-size: 19px; font-weight: 700; color: oklch(97% 0.002 30);">Typra</span>
      </div>
      <div style="display: flex; gap: 24px; font-size: 14px; color: oklch(65% 0.01 30);">
        <span>Bài luyện</span><span>Thứ hạng</span><span>Hồ sơ</span>
      </div>
    </div>
    <div style="padding: 40px 28px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(60% 0.01 30);">
      header preview — logo trên nền đen
    </div>
  </div>

</div>

</x-dc>
</body>
</html>
