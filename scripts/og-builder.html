<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Typre OG image builder</title>
    <!--
      Sinh public/og.png (ảnh xem trước khi chia sẻ link, 1200x630).

      CÁCH CHẠY:
        1. npm run dev
        2. mở http://localhost:5180/scripts/og-builder.html
        3. bấm "tải ảnh xuống", đổi tên thành og.png, thay vào public/

      Vẽ bằng canvas trong TRÌNH DUYỆT chứ không phải Node: ở đây có sẵn font thật
      (Space Grotesk + JetBrains Mono, đúng hai font app đang dùng). Sinh bằng Node thì
      phải tự dựng từng glyph — công sức gấp nhiều lần mà chữ vẫn không khớp app.

      Nằm ở scripts/ chứ không phải public/: dev server của Vite vẫn phục vụ file trong
      thư mục gốc, nhưng bản build production thì không mang theo — không để lọt một
      trang lạ lên typre.dev cho Google lập chỉ mục.

      QUY TẮC DUY NHẤT khi sửa ảnh này: chỉ vẽ thứ app THẬT SỰ có. Bản trước từng quảng
      cáo một tính năng đã bị bỏ, người click vào thấy khác ảnh — tệ hơn là không có ảnh.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #09090b;
        color: #a1a1aa;
        font-family: 'JetBrains Mono', monospace;
        display: grid;
        place-items: center;
        gap: 16px;
        min-height: 100vh;
        padding: 24px;
      }
      canvas { max-width: 100%; border: 1px solid #27272a; }
      a {
        color: #f97316;
        border: 1px solid #f97316;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1200" height="630"></canvas>
    <a id="save" download="og.png">tải ảnh xuống</a>
    <script>
      const W = 1200
      const H = 630

      const ORANGE = '#f97316'
      const ORANGE_SOFT = '#fdba74'
      const BG = '#18181b'
      const CODE_BG = '#0f0f11'
      const ZINC_400 = '#a1a1aa'
      const ZINC_500 = '#71717a'
      const ZINC_700 = '#3f3f46'

      // Bảng màu One Dark Pro — đúng theme mặc định của app, để ảnh trông như ảnh chụp
      // thật chứ không phải hình vẽ lại.
      const KW = '#c678dd'
      const FN = '#61afef'
      const VAR = '#e06c75'
      const NUM = '#d19a66'
      const PUNCT = '#abb2bf'

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath()
        ctx.moveTo(x + r, y)
        ctx.arcTo(x + w, y, x + w, y + h, r)
        ctx.arcTo(x + w, y + h, x, y + h, r)
        ctx.arcTo(x, y + h, x, y, r)
        ctx.arcTo(x, y, x + w, y, r)
        ctx.closePath()
      }

      /** Logo: ba vạch như favicon. */
      function drawLogo(ctx, x, y, size) {
        const unit = size / 32
        ctx.fillStyle = '#000000'
        roundRect(ctx, x, y, size, size, 7 * unit)
        ctx.fill()

        const bars = [ORANGE, ORANGE_SOFT, ORANGE]
        const barW = [16, 11, 7]
        bars.forEach((color, i) => {
          ctx.fillStyle = color
          roundRect(ctx, x + 8 * unit, y + (8 + i * 6) * unit, barW[i] * unit, 3 * unit, 1.5 * unit)
          ctx.fill()
        })
      }

      /**
       * Bài đang gõ dở. `t: false` = chưa gõ tới.
       *
       * Phần chưa gõ để mờ và xám, phần đã gõ giữ màu syntax — đúng cách app hiển thị,
       * và cũng là cách duy nhất để một ảnh TĨNH nói được "đang gõ", không phải ảnh
       * chụp một đoạn code nằm im.
       */
      const CODE_LINES = [
        [
          { s: 'const', c: KW, t: true },
          { s: ' evens = ', c: PUNCT, t: true },
          { s: 'numbers', c: VAR, t: true },
        ],
        [
          { s: '  .', c: PUNCT, t: true },
          { s: 'filter', c: FN, t: true },
          { s: '((', c: PUNCT, t: true },
          { s: 'n', c: VAR, t: true },
          { s: ') => ', c: PUNCT, t: true },
          { s: 'n', c: VAR, t: true },
          { s: ' % ', c: PUNCT, t: true },
          { s: '2', c: NUM, t: true },
          { s: ' === ', c: PUNCT, t: true },
          { s: '0', c: NUM, t: true },
          { s: ')', c: PUNCT, t: true },
        ],
        [
          { s: '  .', c: PUNCT, t: true },
          { s: 'map', c: FN, t: true },
          { s: '((', c: PUNCT, t: true },
          { s: 'n', c: VAR, t: true },
          { s: ') => ', c: PUNCT, t: true, caretAfter: true },
          { s: 'n', c: VAR, t: false },
          { s: ' * ', c: PUNCT, t: false },
          { s: '2', c: NUM, t: false },
          { s: ');', c: PUNCT, t: false },
        ],
      ]

      function drawCode(ctx, x, y, lineHeight) {
        ctx.font = '400 26px "JetBrains Mono", monospace'
        ctx.textAlign = 'left'
        ctx.textBaseline = 'alphabetic'

        CODE_LINES.forEach((line, row) => {
          let penX = x
          const penY = y + row * lineHeight

          for (const seg of line) {
            ctx.globalAlpha = seg.t ? 1 : 0.34
            ctx.fillStyle = seg.t ? seg.c : ZINC_500
            ctx.fillText(seg.s, penX, penY)
            penX += ctx.measureText(seg.s).width

            if (seg.caretAfter) {
              ctx.globalAlpha = 1
              ctx.fillStyle = ORANGE
              ctx.fillRect(penX, penY - 20, 2.5, 27)
            }
          }
        })

        ctx.globalAlpha = 1
      }

      function draw() {
        const ctx = document.getElementById('c').getContext('2d')

        ctx.fillStyle = BG
        ctx.fillRect(0, 0, W, H)

        // Vạch cam mỏng trên cùng: đủ để nhận ra thương hiệu ngay cả khi ảnh bị thu nhỏ.
        ctx.fillStyle = ORANGE
        ctx.fillRect(0, 0, W, 6)

        drawLogo(ctx, 72, 52, 64)

        ctx.textAlign = 'left'
        ctx.textBaseline = 'alphabetic'
        ctx.fillStyle = '#fafafa'
        ctx.font = '700 52px "Space Grotesk", sans-serif'
        ctx.fillText('Typre', 152, 108)

        // Khác biệt thật và còn tồn tại: các trang luyện gõ khác cho gõ văn xuôi, ở đây
        // gõ code thật — dấu ngoặc, toán tử, thụt lề, đúng những ký tự làm chậm tay khi
        // lập trình.
        ctx.fillStyle = '#fafafa'
        ctx.font = '600 46px "Space Grotesk", sans-serif'
        ctx.fillText('Typing practice for', 72, 200)
        ctx.fillStyle = ORANGE
        ctx.fillText('programmers.', 72, 254)

        ctx.fillStyle = ZINC_400
        ctx.font = '400 21px "JetBrains Mono", monospace'
        ctx.fillText('14 languages  ·  2,170 snippets  ·  live races  ·  free', 72, 302)

        // Khung code: nền tối hơn + viền, đúng như vùng gõ trong app.
        const cardX = 72
        const cardY = 348
        const cardW = 620
        const cardH = 186

        ctx.fillStyle = CODE_BG
        roundRect(ctx, cardX, cardY, cardW, cardH, 12)
        ctx.fill()
        ctx.strokeStyle = ZINC_700
        ctx.lineWidth = 1.5
        roundRect(ctx, cardX, cardY, cardW, cardH, 12)
        ctx.stroke()

        drawCode(ctx, cardX + 32, cardY + 54, 44)

        // Cột phải: đúng các số bảng kết quả của app hiện.
        const statX = 780

        ctx.textAlign = 'left'
        ctx.fillStyle = ORANGE
        ctx.font = '700 92px "JetBrains Mono", monospace'
        ctx.fillText('87', statX, cardY + 96)

        const wpmX = statX + ctx.measureText('87').width + 14
        ctx.fillStyle = ZINC_500
        ctx.font = '400 28px "JetBrains Mono", monospace'
        ctx.fillText('wpm', wpmX, cardY + 96)

        ctx.fillStyle = ZINC_400
        ctx.font = '400 22px "JetBrains Mono", monospace'
        ctx.fillText('accuracy 98%', statX, cardY + 146)
        ctx.fillText('consistency 91%', statX, cardY + 180)

        ctx.fillStyle = ORANGE
        ctx.font = '500 28px "JetBrains Mono", monospace'
        ctx.textAlign = 'right'
        ctx.fillText('typre.dev', W - 72, H - 44)
      }

      // Chờ font tải xong mới vẽ: vẽ trước là ra font mặc định của hệ thống.
      document.fonts.ready.then(() => {
        draw()
        document.getElementById('save').href = document
          .getElementById('c')
          .toDataURL('image/png')
      })
    </script>
  </body>
</html>
